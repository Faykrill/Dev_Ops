---
- name: Обновить apt-кэш, если он устарел
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Пакеты для работы с репозиториями
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Каталог для GPG-ключей
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: GPG-ключ официального репозитория Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Официальный apt-репозиторий Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
    content: >-
      deb [arch={{ docker_engine_deb_arch }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable

- name: Docker Engine, CLI, Buildx и Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: 0
