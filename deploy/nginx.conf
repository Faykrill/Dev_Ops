events {}

http {
    server {
        listen 80 default_server;
        server_name _;

        root /results;

        location / {
            try_files $uri =404;
            default_type application/json;
        }

        location ~ /\. {
            deny all;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}